name: Test x86_64
description: Run tests on x86_64 architecture

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Check"]   # 等待名为 "Build Check" 的 workflow 完成
    types:
      - completed          # 当它完成时触发（不论成功或失败）

env:
  ARCH: x86_64
  HOME: /root
  RUSTUP_DIST_SERVER: "https://rsproxy.cn"
  RUSTUP_UPDATE_ROOT: "https://rsproxy.cn/rustup"

jobs:
  integration-test:
    name: Integration Test
    if: ${{ github.event.workflow_run.conclusion == 'success' }}  # 仅在构建成功时执行
    runs-on: ubuntu-latest
    container: 
      image: dragonos/dragonos-dev:v1.14
      options: --privileged -v /dev:/dev
    steps:
      - name: Checkout DragonOS code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dragonos-x86_64-artifacts
          path: bin/

      - name: Run syscall test
        shell: bash -ileo pipefail {0}
        run: |
          make test-syscall